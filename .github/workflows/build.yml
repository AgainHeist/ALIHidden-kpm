name: build-kpm
on:
  push:
  workflow_dispatch:

jobs:
  kpm:
    runs-on: ubuntu-22.04
    env:
      KP_REF: "0.13.1"
      STAGE: "5"
      BTI: "0"
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y make git gcc-aarch64-linux-gnu
      - name: build
        run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Owner_By_ali-kpm
          path: "**/*.kpm"
