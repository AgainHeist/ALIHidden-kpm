name: build-kpm
on: [push, workflow_dispatch]

jobs:
  kpm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y make git gcc-aarch64-linux-gnu
      - run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Owner_By_ali-kpm
          path: "**/*.kpm"
