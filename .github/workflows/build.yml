name: build-kpm

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  kpm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make git gcc-aarch64-linux-gnu

      - name: fetch KernelPatch
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git kp
          ls kp/kernel/include/kpmodule.h
          ls kp/kernel/include/ktypes.h

      - name: build
        run: |
          make -C kpm KP_DIR="$PWD/kp" TARGET_COMPILE=aarch64-linux-gnu-
          ls -la kpm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALiHidden-kpm
          path: "**/*.kpm"
          if-no-files-found: warn
